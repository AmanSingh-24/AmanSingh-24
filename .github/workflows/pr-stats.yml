name: Update PR stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual run from the Actions tab
  push:
    paths:
      - scripts/pr_stats.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate PR stats card
        env:
          GH_USER: AmanSingh-24
          # Optional: add a PAT as the repo secret PR_STATS_TOKEN (with `repo` read access)
          # to also count PRs raised in private org repos. Falls back to the default token.
          GH_TOKEN: ${{ secrets.PR_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/pr_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pr-stats.svg
          git diff --staged --quiet || (git commit -m "chore: update PR stats" && git push)
